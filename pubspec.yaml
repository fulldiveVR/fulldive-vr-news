name: fulldive_vr_news
description: "Fulldive VR News — VR and XR headlines, in the Fulldive style."
publish_to: 'none'

# The build number must stay above the last Unity shell release (6100211),
# otherwise Google Play refuses the upload as a downgrade.
version: 7.0.2+7000002

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.1
  cloud_firestore: ^6.0.2
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
